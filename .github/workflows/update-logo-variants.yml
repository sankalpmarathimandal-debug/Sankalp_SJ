name: Update logo variants

on:
  push:
    paths:
      - "assets/images/branding/logo-variants/**"
      - "scripts/generate_logo_variants.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate logo variants manifest
        run: python3 scripts/generate_logo_variants.py
      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/logo-variants.json
          git diff --cached --quiet || (git commit -m "Auto-update logo variants from folder" && git push)
